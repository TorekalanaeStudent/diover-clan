name: Build Java Files

on:
  push:
    branches: [ main, develop-* ]
  pull_request:
    branches: [ main, develop-* ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile All Java Files
        run: |
          mkdir -p bin
          find . -name "*.java" \
            -not -path "*/springboot-lab/*" \
            -not -path "*/target/*" \
            -not -path "*/build/*" > sources.txt

          if [ -s sources.txt ]; then
            javac -d bin @sources.txt
          fi

      - name: Build Spring Boot Projects (Gradle)
        run: |
          find . -name "build.gradle" -not -path "*/build/*" | while read gradleFile; do
            dir=$(dirname "$gradleFile")
            echo "Building Spring Boot project in $dir"
            cd "$dir" && chmod +x gradlew && ./gradlew build && cd $GITHUB_WORKSPACE
          done
